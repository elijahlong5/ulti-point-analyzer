<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mixed Point Sheet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Public+Sans:wght@400;600;700;800&display=swap">
<style>
/* Layout: turf-striped scoreboard on top, controls, a line-by-gender table, then a ruled point sheet with one row per point. */
:root{
  color-scheme: light;
  --bg:#eef3ec;
  --surface:#ffffff;
  --ink:#14231b;
  --muted:#586b5f;
  --rule:#dbe4d9;
  --line:#b3c3b6;
  --turf:#1c4a36;
  --turf-2:#205640;
  --board-ink:#f3f7f1;
  --board-dim:#b7ccbd;
  --board-rule:rgba(243,247,241,.2);
  --sel-bg:#1c4a36;
  --sel-ink:#f3f7f1;
  --brk:#c4430f;
  --brk-ink:#ffffff;
  --w:#8f2766;
  --w-bg:#f6e3ef;
  --m:#0b6683;
  --m-bg:#dcedf3;
  --focus:#0b6683;
  --font-display:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;
  --font-body:'Public Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d1712;
    --surface:#14221a;
    --ink:#e6efe8;
    --muted:#93a79a;
    --rule:#243629;
    --line:#3b5244;
    --turf:#12301f;
    --turf-2:#163b27;
    --sel-bg:#a6e3bd;
    --sel-ink:#0d1712;
    --brk:#ff8a50;
    --brk-ink:#1c0d04;
    --w:#f2a0cc;
    --w-bg:#3a1b2d;
    --m:#86cfe8;
    --m-bg:#12303b;
    --focus:#86cfe8;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1712;
  --surface:#14221a;
  --ink:#e6efe8;
  --muted:#93a79a;
  --rule:#243629;
  --line:#3b5244;
  --turf:#12301f;
  --turf-2:#163b27;
  --sel-bg:#a6e3bd;
  --sel-ink:#0d1712;
  --brk:#ff8a50;
  --brk-ink:#1c0d04;
  --w:#f2a0cc;
  --w-bg:#3a1b2d;
  --m:#86cfe8;
  --m-bg:#12303b;
  --focus:#86cfe8;
  color-scheme: dark;
}

*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font-body);
  font-size:15px;
  line-height:1.4;
  padding-block:16px 40px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.lab{margin:0;font:700 .66rem/1.2 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

/* Scoreboard */
.board{
  border-radius:12px;
  padding:16px 16px 14px;
  color:var(--board-ink);
  background:repeating-linear-gradient(90deg,var(--turf) 0 40px,var(--turf-2) 40px 80px);
}
.board h1{
  margin:0;
  font:700 .7rem/1 var(--font-body);
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--board-dim);
}
.score{display:flex;align-items:flex-end;justify-content:center;gap:16px;margin:14px 0 8px}
.team{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.tlabel{font:700 .68rem/1 var(--font-body);letter-spacing:.14em;text-transform:uppercase;color:var(--board-dim)}
.num{font:800 5rem/.9 var(--font-display);font-variant-numeric:tabular-nums;color:var(--board-ink)}
.num.trail{color:var(--board-dim)}
.dash{font:700 2.6rem/1 var(--font-display);color:var(--board-dim);padding-bottom:.35rem}
.status{margin:0;text-align:center;font-size:.9rem;color:var(--board-dim)}
.stats{
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;
  margin:12px 0 0;padding-top:12px;border-top:1px solid var(--board-rule);
}
.stats div{min-width:0}
.stats dt{font:700 .6rem/1.2 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--board-dim)}
.stats dd{margin:3px 0 0;font:800 1.35rem/1 var(--font-display);font-variant-numeric:tabular-nums;letter-spacing:.02em}

/* Controls */
.controls{
  background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:14px;
  display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:14px;
}
.field{min-width:0;display:flex;flex-direction:column;gap:6px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:3px;padding:3px;background:var(--bg);border:1.5px solid var(--line);border-radius:10px}
.seg button{min-height:40px;border:0;border-radius:7px;background:transparent;color:var(--ink);font-weight:600;font-size:.9rem;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--sel-bg);color:var(--sel-ink)}
.step{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;align-items:center;background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:3px}
.step button{min-height:40px;border:0;border-radius:7px;background:transparent;color:var(--ink);font-size:1.3rem;font-weight:600;cursor:pointer}
.step button:disabled{color:var(--line);cursor:default}
.step output{text-align:center;font:800 1.5rem/1 var(--font-display);font-variant-numeric:tabular-nums}

/* Points by line */
.card{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:12px 14px 6px}
.lt{width:100%;border-collapse:collapse;margin-top:6px;font-variant-numeric:tabular-nums}
.lt th,.lt td{padding:6px 0;text-align:right}
.lt thead th{font:700 .62rem/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding-bottom:8px;border-bottom:1.5px solid var(--line)}
.lt thead th:first-child,.lt tbody th{text-align:left;width:3rem}
.lt thead th.W{color:var(--w)}
.lt thead th.M{color:var(--m)}
.lt td{font:800 1.4rem/1 var(--font-display)}
.lt td.T{color:var(--muted)}
.lt tbody tr+tr th,.lt tbody tr+tr td{border-top:1px solid var(--rule)}
.lt tbody tr.all th,.lt tbody tr.all td{border-top:1.5px solid var(--line)}
.lt tbody tr.all td{color:var(--ink)}
.lt tbody tr.all th{font:700 .62rem/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.chip{
  width:1.7rem;height:1.7rem;border-radius:5px;display:inline-grid;place-items:center;vertical-align:middle;
  font:800 1.05rem/1 var(--font-display);background:var(--bg);border:1.5px solid var(--line);color:var(--ink);
}

/* Point sheet */
.sheet{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:10px 12px 10px}
.sheet-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:4px 8px;padding:0 0 4px}
.hint{font-size:.8rem;color:var(--muted)}
.acts{display:flex;gap:2px}
.link{border:0;background:transparent;color:var(--ink);font-weight:600;font-size:.82rem;text-decoration:underline;text-underline-offset:3px;cursor:pointer;min-height:36px;padding:0 6px}
.cols,.row{
  display:grid;
  grid-template-columns:1rem 1.5rem auto 2.3rem minmax(0,1fr) 3.4rem;
  gap:5px;align-items:center;
}
.cols{
  padding:8px 0;border-bottom:1.5px solid var(--line);
  font:700 .6rem/1 var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);
}
.cols span:nth-child(2),.cols span:nth-child(3),.cols span:nth-child(4){text-align:center}
.rows{list-style:none;margin:0;padding:0}
.row{min-height:54px;border-bottom:1px solid var(--rule)}
.n{color:var(--muted);font-weight:600;font-size:.8rem;font-variant-numeric:tabular-nums}
.od{width:1.5rem;height:1.5rem;border-radius:50%;display:grid;place-items:center;font:800 .74rem/1 var(--font-body)}
.od-O{background:var(--ink);color:var(--surface)}
.od-D{border:2px solid var(--ink);color:var(--ink)}
.lines{
  position:relative;display:grid;grid-auto-flow:column;grid-auto-columns:1.55rem;gap:2px;padding:2px;
  background:var(--bg);border:1.5px solid var(--line);border-radius:8px;
}
.lines.is-override::after{
  content:"";position:absolute;top:-5px;right:-5px;width:9px;height:9px;border-radius:50%;
  background:var(--ink);box-shadow:0 0 0 2px var(--surface);
}
.ln{height:2.1rem;border:0;border-radius:6px;background:transparent;color:var(--muted);font:800 .95rem/1 var(--font-display);cursor:pointer;padding:0}
.ln:hover{color:var(--ink)}
.ln[aria-pressed="true"]{background:var(--sel-bg);color:var(--sel-ink)}
.match{font:800 1.05rem/1 var(--font-display);letter-spacing:.02em;padding:7px 0;border-radius:6px;text-align:center}
.match.W{background:var(--w-bg);color:var(--w)}
.match.M{background:var(--m-bg);color:var(--m)}
.pts{display:flex;align-items:baseline;gap:3px;font:800 1.45rem/1 var(--font-display);font-variant-numeric:tabular-nums;white-space:nowrap}
.pts .scored{color:var(--ink)}
.pts .other{color:var(--muted);font-weight:700}
.pts .sep{color:var(--line);font-weight:700}
.row.is-break .pts .scored{color:var(--brk)}
.break{
  min-height:40px;width:100%;border-radius:999px;border:1.5px solid var(--line);padding:0;
  background:transparent;color:var(--muted);font-weight:700;font-size:.72rem;letter-spacing:.02em;cursor:pointer;
}
.break:hover{border-color:var(--brk);color:var(--brk)}
.break[aria-pressed="true"]{background:var(--brk);border-color:var(--brk);color:var(--brk-ink)}
.end{margin:0;padding:12px 0 0;color:var(--muted);font-size:.85rem}

@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main class="wrap">
  <header class="board">
    <h1 id="kicker">Mixed Point Sheet</h1>
    <div class="score" aria-hidden="true">
      <div class="team"><span class="tlabel">Us</span><span class="num" id="usNum">0</span></div>
      <span class="dash">–</span>
      <div class="team"><span class="tlabel">Them</span><span class="num" id="themNum">0</span></div>
    </div>
    <p class="status" id="status" aria-live="polite"></p>
    <dl class="stats">
      <div><dt>Breaks us / them</dt><dd id="stBreaks">0 / 0</dd></div>
      <div><dt>Points W / M</dt><dd id="stGender">0 / 0</dd></div>
    </dl>
  </header>

  <section class="controls" aria-label="Game setup">
    <div class="field">
      <span class="lab" id="labStart">Start on</span>
      <div class="seg" role="group" aria-labelledby="labStart" id="segStart">
        <button type="button" id="startO" data-key="start" data-val="O" aria-pressed="false">Offense</button>
        <button type="button" id="startD" data-key="start" data-val="D" aria-pressed="true">Defense</button>
      </div>
    </div>
    <div class="field">
      <span class="lab" id="labGender">Start matching</span>
      <div class="seg" role="group" aria-labelledby="labGender" id="segGender">
        <button type="button" id="genderW" data-key="gender" data-val="W" aria-pressed="true">Woman</button>
        <button type="button" id="genderM" data-key="gender" data-val="M" aria-pressed="false">Man</button>
      </div>
    </div>
    <div class="field">
      <span class="lab" id="labTarget">Game to</span>
      <div class="step" role="group" aria-labelledby="labTarget">
        <button type="button" id="targetDown" aria-label="Lower game to">−</button>
        <output id="targetOut" for="targetDown targetUp">15</output>
        <button type="button" id="targetUp" aria-label="Raise game to">+</button>
      </div>
    </div>
  </section>

  <section class="card" aria-labelledby="labLines">
    <h2 class="lab" id="labLines">Points by line</h2>
    <table class="lt">
      <thead><tr><th scope="col">Line</th><th scope="col" class="W">W</th><th scope="col" class="M">M</th><th scope="col">All</th></tr></thead>
      <tbody id="ltBody"></tbody>
    </table>
  </section>

  <section class="sheet" aria-label="Points">
    <div class="sheet-head">
      <span class="hint">Tap O, X or Y to set a point's line</span>
      <span class="acts">
        <button type="button" class="link" id="resetLines" hidden>Reset lines</button>
        <button type="button" class="link" id="clearBreaks" hidden>Clear breaks</button>
      </span>
    </div>
    <div class="cols" aria-hidden="true">
      <span>Pt</span><span>O/D</span><span>Line</span><span>Match</span><span>Us–Them</span><span></span>
    </div>
    <ol class="rows" id="rows"></ol>
    <p class="end" id="endNote"></p>
  </section>
</main>

<script>
(function(){
/*SIM_START*/
var CYCLE={W:['W2','M1','M2','W1'],M:['M2','W1','W2','M1']};
function simulate(cfg,breaks,lines){
  var rows=[],us=0,them=0,side=cfg.start,dCount=0;
  for(var n=1;n<=120;n++){
    var brk=breaks.indexOf(n)>-1;
    var auto='O';
    if(side==='D'){auto=(dCount%2===0)?'X':'Y';dCount++;}
    var ov=lines[n]||null;
    var line=ov||auto;
    var weScore=(side==='O')?!brk:brk;
    if(weScore)us++;else them++;
    rows.push({n:n,label:CYCLE[cfg.gender][(n-1)%4],side:side,auto:auto,line:line,manual:line!==auto,brk:brk,us:us,them:them,weScore:weScore});
    if(Math.max(us,them)>=cfg.target)break;
    if(!brk)side=(side==='O')?'D':'O';
  }
  return {rows:rows,us:us,them:them};
}
function tally(rows){
  var c={O:{W:0,M:0},X:{W:0,M:0},Y:{W:0,M:0}};
  rows.forEach(function(r){c[r.line][r.label.charAt(0)]++;});
  return c;
}
/*SIM_END*/

var KEY='mixed-point-sheet-v1';
var state={start:'D',gender:'W',target:15,breaks:[],lines:{}};
try{
  var saved=JSON.parse(localStorage.getItem(KEY)||'null');
  if(saved){
    if(saved.start==='O'||saved.start==='D')state.start=saved.start;
    if(saved.gender==='W'||saved.gender==='M')state.gender=saved.gender;
    if(typeof saved.target==='number'&&saved.target>=3&&saved.target<=25)state.target=saved.target;
    if(Array.isArray(saved.breaks))state.breaks=saved.breaks.filter(function(x){return typeof x==='number';});
    if(saved.lines&&typeof saved.lines==='object'){
      Object.keys(saved.lines).forEach(function(k){
        var v=saved.lines[k];
        if(v==='O'||v==='X'||v==='Y')state.lines[k]=v;
      });
    }
  }
}catch(e){}

function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}
function $(id){return document.getElementById(id);}

var focusSel=null;

function render(){
  var sim=simulate(state,state.breaks,state.lines);
  var rows=sim.rows;

  document.querySelectorAll('.seg button').forEach(function(b){
    b.setAttribute('aria-pressed',String(state[b.dataset.key]===b.dataset.val));
  });
  $('targetOut').textContent=state.target;
  $('targetDown').disabled=state.target<=3;
  $('targetUp').disabled=state.target>=25;
  $('kicker').textContent='Mixed Point Sheet · to '+state.target;

  $('usNum').textContent=sim.us;
  $('themNum').textContent=sim.them;
  $('usNum').classList.toggle('trail',sim.us<sim.them);
  $('themNum').classList.toggle('trail',sim.them<sim.us);
  $('status').textContent='Final · '+rows.length+' points · '+(sim.us>sim.them?'Win':'Loss')+' by '+Math.abs(sim.us-sim.them);

  var ourB=0,theirB=0,w=0,m=0;
  rows.forEach(function(r){
    if(r.brk){if(r.side==='D')ourB++;else theirB++;}
    if(r.label.charAt(0)==='W')w++;else m++;
  });
  $('stBreaks').textContent=ourB+' / '+theirB;
  $('stGender').textContent=w+' / '+m;

  var c=tally(rows);
  $('ltBody').innerHTML=['O','X','Y'].map(function(L){
    var t=c[L].W+c[L].M;
    return '<tr><th scope="row"><span class="chip">'+L+'</span></th><td>'+c[L].W+'</td><td>'+c[L].M+'</td><td class="T">'+t+'</td></tr>';
  }).join('')+'<tr class="all"><th scope="row">All</th><td>'+w+'</td><td>'+m+'</td><td class="T">'+rows.length+'</td></tr>';

  $('rows').innerHTML=rows.map(function(r){
    var odName=r.side==='O'?'Offense point':'Defense point';
    var g=r.label.charAt(0);
    var toggle='<span class="lines'+(r.manual?' is-override':'')+'" role="group" aria-label="Line for point '+r.n+'">'
      +['O','X','Y'].map(function(L){
        return '<button type="button" class="ln" data-n="'+r.n+'" data-line="'+L+'" aria-pressed="'+(r.line===L)+'">'+L+'</button>';
      }).join('')
      +'</span>';
    return '<li class="row'+(r.brk?' is-break':'')+'" data-n="'+r.n+'">'
      +'<span class="n">'+r.n+'</span>'
      +'<span class="od od-'+r.side+'" aria-label="'+odName+'">'+r.side+'</span>'
      +toggle
      +'<span class="match '+g+'">'+r.label+'</span>'
      +'<span class="pts" aria-label="Score '+r.us+' to '+r.them+(r.weScore?', we scored':', they scored')+'">'
        +'<span class="'+(r.weScore?'scored':'other')+'">'+r.us+'</span>'
        +'<span class="sep">–</span>'
        +'<span class="'+(r.weScore?'other':'scored')+'">'+r.them+'</span>'
      +'</span>'
      +'<button type="button" class="break" data-n="'+r.n+'" aria-pressed="'+r.brk+'">Break</button>'
      +'</li>';
  }).join('');

  $('endNote').textContent='Game over · first to '+state.target;
  $('clearBreaks').hidden=!rows.some(function(r){return r.brk;});
  $('resetLines').hidden=!rows.some(function(r){return r.manual;});

  if(focusSel){
    var el=document.querySelector(focusSel);
    if(el)el.focus();
    focusSel=null;
  }
}

function currentRow(n){
  var rows=simulate(state,state.breaks,state.lines).rows;
  for(var i=0;i<rows.length;i++){if(rows[i].n===n)return rows[i];}
  return null;
}

document.addEventListener('click',function(e){
  var seg=e.target.closest('.seg button');
  if(seg){
    state[seg.dataset.key]=seg.dataset.val;
    save();render();return;
  }
  var ln=e.target.closest('.ln');
  if(ln){
    var pn=parseInt(ln.dataset.n,10);
    var pick=ln.dataset.line;
    var row=currentRow(pn);
    if(row){
      if(pick===row.line){
        if(row.manual)delete state.lines[pn];
      }else if(pick===row.auto){
        delete state.lines[pn];
      }else{
        state.lines[pn]=pick;
      }
    }
    focusSel='.ln[data-n="'+pn+'"][data-line="'+pick+'"]';
    save();render();return;
  }
  var brk=e.target.closest('.break');
  if(brk){
    var n=parseInt(brk.dataset.n,10);
    var i=state.breaks.indexOf(n);
    if(i>-1)state.breaks.splice(i,1);else state.breaks.push(n);
    focusSel='.break[data-n="'+n+'"]';
    save();render();return;
  }
  if(e.target.id==='targetDown'&&state.target>3){state.target--;save();render();return;}
  if(e.target.id==='targetUp'&&state.target<25){state.target++;save();render();return;}
  if(e.target.id==='clearBreaks'){state.breaks=[];save();render();return;}
  if(e.target.id==='resetLines'){state.lines={};save();render();}
});

render();
})();
</script>
</body>
</html>
